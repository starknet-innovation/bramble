[package]
name = "mc_multisig"
version = "0.1.0"
edition = "2024_07"

# Pinned exactly: the class hash pinned in src/starknet/multisig-deploy.ts is
# reproducible only with these versions plus the scarb release recorded in
# scripts/vendor-multisig.ts.
[dependencies]
starknet = "=2.18.0"
openzeppelin_governance = "=3.0.0"

[dev-dependencies]
snforge_std = "=0.59.0"

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
