# detekt 1.23.8 (pinned in mobile/scripts/lint-tools.sh). Run: bash mobile/scripts/lint.sh kotlin
#
# lint.sh runs detekt with `--build-upon-default-config`, so the default config is the base and
# this file overrides it. Strictness is explicit rather than `--all-rules`: in detekt 1.23.8 that
# CLI flag does not activate the rules the default config ships inactive (verified: it leaves
# UndocumentedPublicClass off), so every one of those rules is switched on by name below. The list
# is every `active: false` rule in `detekt --generate-config` for 1.23.8; regenerate it on upgrade.
#
# Three stay off, each because it contradicts the repository (see the comments at each). Nothing
# is switched off to hide findings, and inline @Suppress is not used anywhere (AGENTS.md): fix the
# code, or change a rule here in review. Generated code (*.generated.kt, the UniFFI bindings under
# build/) is excluded on the command line.
#
# Rules that need type resolution (for example Deprecation, ExplicitCollectionElementAccessMethod)
# are active but report nothing until detekt is given the compiled classpath, which needs a
# working Android build first.

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: true
  checkExhaustiveness: false

comments:
  # There is no license-header convention here (no license.template to match).
  AbsentOrWrongFileLicense:
    active: false
  # These two forbid KDoc on private members. AGENTS.md asks for comments that explain trust
  # boundaries and failure behaviour wherever they are, so they contradict the repository.
  CommentOverPrivateFunction:
    active: false
  CommentOverPrivateProperty:
    active: false
  DeprecatedBlockTag:
    active: true
  EndOfSentenceFormat:
    active: true
  KDocReferencesNonPublicProperty:
    active: true
  OutdatedDocumentation:
    active: true
  UndocumentedPublicClass:
    active: true
  UndocumentedPublicFunction:
    active: true
  UndocumentedPublicProperty:
    active: true

complexity:
  CognitiveComplexMethod:
    active: true
  ComplexInterface:
    active: true
  LabeledExpression:
    active: true
  # Tightened from 600 to the repository's 500-line file rule (AGENTS.md).
  LargeClass:
    threshold: 500
  MethodOverloading:
    active: true
  NamedArguments:
    active: true
  NestedScopeFunctions:
    active: true
  ReplaceSafeCallChainWithRun:
    active: true
  StringLiteralDuplication:
    active: true

coroutines:
  GlobalCoroutineUsage:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true

exceptions:
  NotImplementedDeclaration:
    active: true
  ObjectExtendsThrowable:
    active: true
  ThrowingExceptionInMain:
    active: true

naming:
  BooleanPropertyNaming:
    active: true
  ForbiddenClassName:
    active: true
  FunctionMaxLength:
    active: true
  FunctionMinLength:
    active: true
  # Jetpack Compose names @Composable functions in PascalCase by convention.
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  LambdaParameterNaming:
    active: true
  NonBooleanPropertyPrefixedWithIs:
    active: true
  VariableMaxLength:
    active: true
  VariableMinLength:
    active: true

performance:
  CouldBeSequence:
    active: true
  UnnecessaryPartOfBinaryExpression:
    active: true

potential-bugs:
  CastNullableToNonNullableType:
    active: true
  CastToNullableType:
    active: true
  Deprecation:
    active: true
  DontDowncastCollectionTypes:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  ExitOutsideMain:
    active: true
  ImplicitUnitReturnType:
    active: true
  LateinitUsage:
    active: true
  MissingPackageDeclaration:
    active: true
  NullCheckOnMutableProperty:
    active: true
  NullableToStringCall:
    active: true
  PropertyUsedBeforeDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullCheck:
    active: true

style:
  AlsoCouldBeApply:
    active: true
  BracesOnIfStatements:
    active: true
  BracesOnWhenStatements:
    active: true
  CanBeNonNullable:
    active: true
  CascadingCallWrapping:
    active: true
  ClassOrdering:
    active: true
  CollapsibleIfStatements:
    active: true
  DataClassContainsFunctions:
    active: true
  DataClassShouldBeImmutable:
    active: true
  DoubleNegativeLambda:
    active: true
  EqualsOnSignatureLine:
    active: true
  ExplicitCollectionElementAccessMethod:
    active: true
  ExpressionBodySyntax:
    active: true
  ForbiddenAnnotation:
    active: true
  ForbiddenImport:
    active: true
  ForbiddenMethodCall:
    active: true
  ForbiddenSuppress:
    active: true
  MandatoryBracesLoops:
    active: true
  MaxChainedCallsOnSameLine:
    active: true
  # Must match ktlint's max_line_length in mobile/android/.editorconfig.
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: false
  MultilineLambdaItParameter:
    active: true
  MultilineRawStringIndentation:
    active: true
  NoTabs:
    active: true
  NullableBooleanCheck:
    active: true
  OptionalUnit:
    active: true
  PreferToOverPairSyntax:
    active: true
  RedundantExplicitType:
    active: true
  RedundantVisibilityModifierRule:
    active: true
  SpacingBetweenPackageAndImports:
    active: true
  StringShouldBeRawString:
    active: true
  TrailingWhitespace:
    active: true
  TrimMultilineRawString:
    active: true
  UnderscoresInNumericLiterals:
    active: true
  UnnecessaryAnnotationUseSiteTarget:
    active: true
  UnnecessaryBackticks:
    active: true
  UnnecessaryBracesAroundTrailingLambda:
    active: true
  UnnecessaryInnerClass:
    active: true
  UnnecessaryLet:
    active: true
  UnnecessaryParentheses:
    active: true
  UntilInsteadOfRangeTo:
    active: true
  UnusedImports:
    active: true
  # @Preview functions are private and reached only by the IDE's preview renderer.
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  UseDataClass:
    active: true
  UseEmptyCounterpart:
    active: true
  UseIfEmptyOrIfBlank:
    active: true
  UseIfInsteadOfWhen:
    active: true
  UseLet:
    active: true
  UseSumOfInsteadOfFlatMapSize:
    active: true
