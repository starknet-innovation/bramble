# XcodeGen spec. The .xcodeproj is generated, not committed: `xcodegen generate` in mobile/ios.
# Build the Rust core first: mobile/scripts/build-core-ios.sh
name: Bramble
options:
  bundleIdPrefix: org.bramble
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Simulator builds sign ad hoc: an unsigned app cannot use the data-protection Keychain, so a
    # plain `xcodebuild test` needs no extra flag (README).
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  # UniFFI's generated Swift, compiled as its own module so the app writes `import BrambleCore`.
  BrambleCore:
    type: framework
    platform: iOS
    sources:
      - path: Generated/Swift
    dependencies:
      - framework: Generated/BrambleCoreFFI.xcframework
        embed: false
    settings:
      base:
        MACH_O_TYPE: staticlib
        PRODUCT_BUNDLE_IDENTIFIER: org.bramble.core
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal

  Bramble:
    type: application
    platform: iOS
    sources:
      - path: Bramble
      # The onboarding landscape is the extension's own asset, bundled by reference, not copied.
      - path: ../../apps/extension/public/brand/onboarding-landscape.webp
        buildPhase: resources
    dependencies:
      - target: BrambleCore
    # Every file the app creates defaults to complete protection (unreadable while the device is
    # locked), including the vault files the core writes.
    entitlements:
      path: Bramble/Bramble.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bramble.wallet
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bramble
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        # AppIcon is rendered by scripts/render-brand-assets.ts, the extension icon's source.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Dark is the default appearance from the launch screen on; Light stays a user choice.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # Generated copy (scripts/mobile-assets/security-copy.ts); checked in bun run check.
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Bramble uses Face ID to unlock your wallet instead of typing your passphrase."

  BrambleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrambleTests
      - path: ../core/tests/fixtures/extension-parity.json
        buildPhase: resources
      # The send tests reach the app's send model through `@testable import Bramble` and replay
      # the same transaction fixture as the Rust suite.
      - path: ../core/tests/fixtures/extension-transactions-wire.json
        buildPhase: resources
      - path: ../core/tests/fixtures/extension-transactions-rules.json
        buildPhase: resources
      - path: ../core/tests/fixtures/extension-transactions-presentation.json
        buildPhase: resources
      - path: ../core/tests/fixtures/extension-transactions-status.json
        buildPhase: resources
      - path: ../core/tests/fixtures/extension-transactions-copy.json
        buildPhase: resources
      - path: ../core/tests/fixtures/accounts-parity-families.json
        buildPhase: resources
      - path: ../core/tests/fixtures/accounts-parity-rules.json
        buildPhase: resources
      - path: ../core/tests/fixtures/nostr-multisig-parity.json
        buildPhase: resources
      - path: ../core/tests/fixtures/portfolio-parity.jsonl
        buildPhase: resources
      # The privacy fixture the privacy tests replay (docs/privacy.md §7).
      - path: ../core/tests/fixtures/extension-privacy-wire.json
        buildPhase: resources
      - path: ../core/tests/fixtures/extension-privacy-rules.json
        buildPhase: resources
      - path: ../core/tests/fixtures/extension-privacy-copy.json
        buildPhase: resources
    dependencies:
      # Hosted in the app so `@testable import Bramble` reaches the Keychain, clock and copy code,
      # and the host-side account code (Clipboard, the discovery driver, routing).
      - target: Bramble
      - target: BrambleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bramble.wallet.tests
        GENERATE_INFOPLIST_FILE: YES

  BrambleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BrambleUITests
      - path: ../core/tests/fixtures/ui-coordination.json
        buildPhase: resources
    dependencies:
      - target: Bramble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bramble.wallet.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bramble

schemes:
  Bramble:
    build:
      targets:
        Bramble: all
        BrambleTests: [test]
        BrambleUITests: [test]
    test:
      targets:
        - BrambleTests
        - BrambleUITests
