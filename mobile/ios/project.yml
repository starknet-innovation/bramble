# XcodeGen spec. The .xcodeproj is generated, not committed: `xcodegen generate` in mobile/ios.
# Build the Rust core first: mobile/scripts/build-core-ios.sh
name: Bramble
options:
  bundleIdPrefix: org.bramble
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  # UniFFI's generated Swift, compiled as its own module so the app writes `import BrambleCore`.
  BrambleCore:
    type: framework
    platform: iOS
    sources:
      - path: Generated/Swift
    dependencies:
      - framework: Generated/BrambleCoreFFI.xcframework
        embed: false
    settings:
      base:
        MACH_O_TYPE: staticlib
        PRODUCT_BUNDLE_IDENTIFIER: org.bramble.core
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal

  Bramble:
    type: application
    platform: iOS
    sources:
      - path: Bramble
      # The onboarding landscape is the extension's own asset, bundled by reference, not copied.
      - path: ../../apps/extension/public/brand/onboarding-landscape.webp
        buildPhase: resources
    dependencies:
      - target: BrambleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bramble.wallet
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bramble
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        # AppIcon is rendered by scripts/render-brand-assets.ts, the extension icon's source.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Vault files default to complete protection even outside VaultDirectory.
        INFOPLIST_KEY_NSFileProtectionComplete: YES

  BrambleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrambleTests
      - path: ../core/tests/fixtures/extension-parity.json
        buildPhase: resources
      - path: ../core/tests/fixtures/accounts-parity-families.json
        buildPhase: resources
      - path: ../core/tests/fixtures/accounts-parity-rules.json
        buildPhase: resources
    dependencies:
      - target: BrambleCore
      # Hosted in the app so host-side account code (Clipboard, the discovery driver, routing)
      # is testable with `@testable import Bramble`.
      - target: Bramble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bramble.wallet.tests
        GENERATE_INFOPLIST_FILE: YES

  BrambleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BrambleUITests
    dependencies:
      - target: Bramble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bramble.wallet.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bramble

schemes:
  Bramble:
    build:
      targets:
        Bramble: all
        BrambleTests: [test]
        BrambleUITests: [test]
    test:
      targets:
        - BrambleTests
        - BrambleUITests
