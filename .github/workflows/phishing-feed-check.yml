name: Phishing feed check

# The extension reads the live phishing list with no host permission (issue
# 772), so it depends on the source answering 200 with an open CORS header and
# a list that fits its caps. This fails the run, and so alerts, when it doesn't.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phishing-feed-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Check the live phishing feed
        run: bun run scripts/check-phishing-feed.ts
