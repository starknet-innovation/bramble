name: mobile

# Mobile wallet CI: the Rust core, the pinned strict linters, the iOS unit tests, and the Android
# JVM unit and instrumented tests. Path-scoped so extension-only PRs do not pay for macOS runners.
#
# Trust boundary (scripts/mobile-workflow-policy.ts): hosted runners only, no privileged
# triggers, no write scope, no secrets, and checkouts never persist the token, because every job
# runs pull-request code through Cargo, Gradle or xcodebuild. Tools come from pins: actions by
# commit SHA, SwiftLint/ktlint/detekt/XcodeGen by SHA-256 (mobile/scripts/lint-tools.sh), the
# Rust toolchain by exact version, cargo-ndk by exact version with --locked, and Gradle through
# its committed, checksum-verified wrapper.
#
# The UI test suite (BrambleUITests) stays local: it drives mainnet and Face ID enrolment and
# takes too long for every PR. See mobile/README.md.
on:
  pull_request:
    paths:
      - "mobile/**"
      - "apps/extension/public/brand/onboarding-landscape.webp"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main, feature/mobile-wallet]
    paths:
      - "mobile/**"
      - "apps/extension/public/brand/onboarding-landscape.webp"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact toolchain so clippy's lint set cannot change under an unchanged commit.
  RUST_TOOLCHAIN: 1.97.1

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast

  lint:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      # ktlint and detekt run on the JDK named by JAVA_HOME, which setup-java exports.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run mobile:lint

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      # CoreSimulator rebuilds its device caches on first contact and, on the hosted image, often
      # cannot finish before the first query: xcodebuild then sees no iOS Simulator destination at
      # all, and `-downloadPlatform` dies with "Unable to connect to simulator." (runner-images
      # #12862, the maintainers' workaround). Xcode 16.4 is the image default with its iOS
      # simulator preinstalled, so nothing is downloaded: wake the service, then pick a device by
      # id rather than a model name that changes with the Xcode release.
      - name: Pick a simulator
        run: |
          xcrun simctl list > /dev/null
          for attempt in 1 2 3 4 5 6; do
            SIM_ID=$(xcrun simctl list devices available | grep -m1 -E '^\s+iPhone' | grep -oE '[0-9A-F-]{36}' || true)
            [ -n "$SIM_ID" ] && break
            sleep 15
          done
          test -n "$SIM_ID"
          xcrun simctl list devices available | grep -m1 -E '^\s+iPhone'
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --target aarch64-apple-ios --target aarch64-apple-ios-sim
          rustup default "$RUST_TOOLCHAIN"
      - run: bash mobile/scripts/build-core-ios.sh debug
      - name: Generate Xcode project
        run: |
          bash mobile/scripts/lint-tools.sh xcodegen
          cd mobile/ios && ../.tools/xcodegen-2.44.1/xcodegen/bin/xcodegen generate
      # A clean build whose log also feeds SwiftLint's analyzer rules below.
      - name: Build for testing
        working-directory: mobile/ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project Bramble.xcodeproj -scheme Bramble \
            -destination "id=$SIM_ID" \
            -derivedDataPath build/DerivedData clean build-for-testing | tee build/xcodebuild.log
      - name: Unit tests
        working-directory: mobile/ios
        run: |
          xcodebuild -project Bramble.xcodeproj -scheme Bramble \
            -destination "id=$SIM_ID" \
            -derivedDataPath build/DerivedData -only-testing:BrambleTests test-without-building
      - name: SwiftLint analyzer rules
        run: bash mobile/scripts/lint.sh swift-analyze mobile/ios/build/xcodebuild.log

  # Builds the core and runs the JVM unit tests. It uses macOS because build-core-android.sh reads
  # the host core as a .dylib for UniFFI's bindgen; the core it builds (the x86_64 library and the
  # Kotlin bindings, neither committed) is handed to android-device below.
  android:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK. Its sdkmanager adds the exact packages, since
      # third-party setup actions are not on the organisation's allowlist.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Install Rust toolchain and cargo-ndk
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --target aarch64-linux-android --target x86_64-linux-android
          rustup default "$RUST_TOOLCHAIN"
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash mobile/scripts/build-core-android.sh debug
      - name: JVM unit tests
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-core
          path: |
            mobile/android/app/src/main/jniLibs/x86_64/
            mobile/android/app/build/generated/uniffi/
          if-no-files-found: error
          retention-days: 1

  # The instrumented suite (flows, security, core bridge) on an API 35 x86_64 emulator. Linux,
  # because hosted macOS runners cannot hardware-accelerate an Android emulator; the core comes
  # prebuilt from the android job. The send, deploy, token, accounts, multisig and portfolio tests
  # answer from the offline FixtureNode, which refuses every write; the onboarding and Home tests
  # read public mainnet data, as the iOS UI suite does (mobile/README.md).
  android-device:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-core
          path: mobile/android/app
      # The artifact keeps paths relative to their common root (src/main/jniLibs, build/generated).
      - name: Place the prebuilt core
        run: |
          test -f mobile/android/app/src/main/jniLibs/x86_64/libbramble_core.so
          test -f mobile/android/app/build/generated/uniffi/org/bramble/core/bramble_core.kt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" \
            "system-images;android-35;google_apis;x86_64"
      - name: Boot the emulator
        run: |
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force \
            -n ci -k "system-images;android-35;google_apis;x86_64" -d pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-snapshot \
            -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for attempt in $(seq 1 60); do
            booted=$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')
            [ "$booted" = "1" ] && break
            sleep 5
          done
          test "$booted" = "1"
      - name: Instrumented tests
        working-directory: mobile/android
        run: ./gradlew :app:connectedDebugAndroidTest
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-reports
          path: |
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulator.log
          retention-days: 7
