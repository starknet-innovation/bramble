# Terminal app unit tests (issue #65).
#
# apps/terminal is a standalone Vite + React package with its own package.json,
# lockfile, tsconfig, and Vitest config. The main ci.yml only typechecks and
# production-builds it (and only inside the release-validation job, which runs
# solely on release/hotfix PRs into main). That means a logic regression in a
# protocol builder — a wrong Call[] shape, a broken quote transform — compiles,
# builds, and merges green because nothing runs the terminal's assertions.
#
# This workflow closes that gap: it runs the terminal's Vitest suite on every PR
# (and every push to main) that TOUCHES apps/terminal, via the native `paths:`
# filter below. A PR that changes only the extension (src/**) never triggers this
# workflow, so an unrelated change can neither be slowed nor turned red by it.
#
# check:api disposition (deliberate): the terminal's `check:api` smoke test hits
# live upstreams (AVNU, Ekubo, Extended) and is intentionally NOT wired here — a
# transient upstream outage must never redden a code PR. It stays a manual/
# scheduled concern (see the nightly.yml pattern) and is tracked as follow-up.
name: terminal-ci

on:
  pull_request:
    paths:
      - "apps/terminal/**"
      - ".github/workflows/terminal-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/terminal/**"
      - ".github/workflows/terminal-ci.yml"

permissions:
  contents: read

concurrency:
  group: terminal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      # Install against the terminal's own frozen lockfile (its dependency set is
      # separate from the repo root) and run its Vitest suite. `bun run test`
      # resolves to `vitest run`; a failing assertion exits non-zero and fails
      # this required check.
      - name: Terminal unit tests
        run: cd apps/terminal && bun install --frozen-lockfile && bun run test
