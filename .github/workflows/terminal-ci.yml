# Terminal app unit tests (issue #65).
#
# apps/terminal is a standalone Vite + React workspace package. The main
# fast-checks job runs its typecheck and Vitest suite through check:workspaces;
# this path-scoped workflow adds the production Vite bundle gate without making
# unrelated extension PRs pay for it.
#
# check:api disposition (deliberate): the terminal's `check:api` smoke test hits
# live upstreams (AVNU, Ekubo, Extended) and is intentionally NOT wired here — a
# transient upstream outage must never redden a code PR. It stays a manual/
# scheduled concern (see the nightly.yml pattern) and is tracked as follow-up.
name: terminal-ci

on:
  pull_request:
    paths:
      - "apps/terminal/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/terminal-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/terminal/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/terminal-ci.yml"

permissions:
  contents: read

concurrency:
  group: terminal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build Terminal
        run: bun run --filter @bramble/terminal build
