name: Release integration

# Broader, post-merge integration for the release-branch model (DEVELOPMENT.md).
# Runs on every push to a `release/**` branch — i.e. after a feature/fix/chore
# PR merges into the active release branch. It exercises the heavier steps the
# fast PR CI deliberately skips: the vendored contract toolchain, the
# extension build, and the reproducible package. This is the "integration"
# tier; the full E2E + audit + regression suite runs nightly (nightly.yml).
#
# The vendor steps need network access plus the contract toolchains. They run on
# the same self-hosted CodeBuild runner CI uses (toolchain present).
# If a vendor step fails (e.g. network access or toolchain drift) the job
# writes a clear explanation to the run summary and then fails honestly — it
# never fakes success.
on:
  push:
    branches: ["release/**"]

permissions:
  contents: read

jobs:
  integration:
    runs-on:
      - codebuild-gha-runner-mc-wallet-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # No later step talks to GitHub, so the token is not left in .git/config
      # while dependency and vendoring code runs (supply audit F3).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Verify the pinned production Argent release and official artifacts.
      - name: Vendor Argent account contracts
        run: |
          set -o pipefail
          if ! bun run vendor:argent; then
            {
              echo "### Release integration: \`vendor:argent\` FAILED"
              echo ""
              echo "This step needs network access to the pinned official Argent"
              echo "release. A failure is a provenance/vendoring issue, not a"
              echo "wallet source-code failure."
              echo "See scripts/vendor-argent-contracts.ts."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Vendor Starknet privacy SDK
        run: |
          set -o pipefail
          if ! bun run vendor:privacy; then
            {
              echo "### Release integration: \`vendor:privacy\` FAILED"
              echo ""
              echo "This step needs network access plus Node.js 24 and npm to"
              echo "build the exact pinned official browser SDK. The runtime"
              echo "digest is checked before it can enter the extension package."
              echo "See scripts/vendor-privacy-sdk.ts."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Build extension
        run: bun run build
      - name: Package extension
        run: bun run package:extension
      - name: Verify checksum
        working-directory: artifacts
        run: sha256sum -c ./*.zip.sha256
      - name: Integration summary
        if: success()
        run: |
          {
            echo "### Release integration: PASS"
            echo ""
            echo "Vendored crypto/contract toolchain, built the extension, and produced"
            echo "a reproducible package on \`${GITHUB_REF_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"
      # Artifact names cannot contain "/", so slugify the branch ref.
      - name: Compute artifact name
        id: meta
        run: echo "name=bramble-extension-$(echo "$GITHUB_REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
