name: CI

# Layered CI — the "PR CI" tier of the model in DEVELOPMENT.md.
#
# Triggers on every PR into `main` OR a `release/**` branch (the only two valid
# PR targets) and on push to `main`. Three jobs realize the layering:
#
#   - pr-guards          scope + naming enforcement (blocking target/linked-issue
#                        guards, advisory branch-name guard). Fast, hosted runner.
#   - fast-checks        the FAST, offline-capable gates that run on EVERY PR:
#                        biome lint, typecheck, file/config + manifest standards,
#                        import-layer/cycle checks, unit + conformance tests, and
#                        the coverage floor. Hosted runner; no crypto/contract
#                        toolchain, no build, no E2E — so PR feedback stays fast.
#   - release-validation the FULL heavy pipeline (verify contracts/SDKs, build,
#                        package, E2E, dependency audit, checksum). Gated to run
#                        ONLY on release/** and hotfix/** PRs into `main` — the
#                        complete release-validation suite before a promotion.
#
# The heavier post-merge and scheduled tiers live in release-integration.yml
# (push to release/**) and nightly.yml (full suite + audit vs. the active
# release branch). Everyday feature/fix/chore PRs into a release branch get only
# pr-guards + fast-checks; they do not pay for the heavy pipeline.
on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Scope + naming enforcement for the release-branch workflow (DEVELOPMENT.md).
  # Blocking guards (PR-target, linked-issue) fail the check; the branch-name
  # guard is advisory (annotation only). Lightweight: runs on a hosted runner,
  # never touches the toolchain, so it returns feedback fast and in parallel
  # with fast-checks. NOTE: a red guard here is only *merge-blocking* once it is
  # a required status check in branch protection (see DEVELOPMENT.md).
  pr-guards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const base = pr.base.ref;
            const head = pr.head.ref;
            // Untrusted fields are read from the event payload in JS (never
            // interpolated into a shell), so there is no injection surface.
            const text = `${pr.title || ""}\n${pr.body || ""}`;

            // Prefixes classify automation branches for the advisory naming
            // check only; a contributor-controlled branch name is not proof of
            // bot identity and must never grant a blocking-guard exemption.
            const AUTOMATION_PREFIXES = ["cursor/", "codex/", "ai-findings-autofix/", "qa/", "dependabot/"];
            const isAutomationBranch = AUTOMATION_PREFIXES.some((p) => head.startsWith(p));
            const isTrustedDependabot =
              head.startsWith("dependabot/") &&
              pr.user?.login === "dependabot[bot]" &&
              pr.user?.type === "Bot";

            let blocked = false;
            const problems = [];
            const notes = [];
            const fail = (m) => { blocked = true; problems.push(m); core.error(m); };
            const warn = (m) => { notes.push(m); core.warning(m); };

            // 1. PR-target guard (BLOCKING, FAIL-CLOSED). Only an explicit
            //    allowlist of head-branch categories may target `main`:
            //      release/**, hotfix/**  — promotion and hotfix paths
            //      chore/**,   docs/**    — repo plumbing and docs, not part of
            //                               a release slice (this PR is one)
            //    plus an authenticated Dependabot PR. Prefix matching alone
            //    never grants an exception because head names are untrusted.
            //    EVERYTHING ELSE is treated as feature-like release work and
            //    must go through the active `release/vX.Y` branch, so a PR into
            //    `main` FAILS. This is deliberately fail-closed: we allowlist
            //    what may reach main rather than blocklisting a couple of known
            //    feature prefixes. That closes the gap where a prefix we didn't
            //    explicitly recognize — `feat/`, `feature/`, `fix/`, or any
            //    unknown/typo prefix — slipped straight to main and skipped
            //    release-validation. Adding a new legit direct-to-main category
            //    now requires editing ALLOWED_INTO_MAIN below, on purpose.
            const ALLOWED_INTO_MAIN = /^(release|hotfix|chore|docs)\//;
            const isAllowedIntoMain = ALLOWED_INTO_MAIN.test(head) || isTrustedDependabot;
            if (base === "main") {
              if (isAllowedIntoMain) {
                notes.push(`PR-target guard: \`${head}\` -> \`main\` is allowed (${isTrustedDependabot ? "authenticated Dependabot PR" : "release/hotfix promotion or chore/docs plumbing"}).`);
              } else {
                fail(`PR-target guard: head \`${head}\` is not an allowed \`main\` target — it is treated as feature-like release work and must target the active \`release/vX.Y\` branch (see DEVELOPMENT.md). Retarget this PR to that release branch. Only \`release/**\`, \`hotfix/**\`, \`chore/**\`, \`docs/**\`, and authenticated Dependabot PRs may target main directly.`);
              }
            }

            // 2. Linked-issue guard (BLOCKING on release/** bases). Every PR into
            //    a release branch must reference its roadmap issue.
            if (/^release\//.test(base)) {
              const closeMatch = text.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/i);
              const bareMatch = text.match(/#(\d+)\b/);
              const issueNumber = closeMatch ? Number(closeMatch[1]) : bareMatch ? Number(bareMatch[1]) : null;
              if (issueNumber === null) {
                fail(`Linked-issue guard: a PR into \`${base}\` must reference its roadmap issue (\`#N\` or \`Closes/Fixes/Resolves #N\`) in the title or body. Scope changes go to the milestone/roadmap, not implicitly via PRs (see DEVELOPMENT.md).`);
              } else {
                // Best-effort milestone match — WARN only, never blocks.
                const baseVersion = base.replace(/^release\//, ""); // e.g. "v0.4"
                try {
                  const { data: issue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                  });
                  const ms = issue.milestone ? issue.milestone.title : null;
                  if (!ms) {
                    warn(`Linked-issue guard (advisory): issue #${issueNumber} has no milestone; expected \`${baseVersion}\` to match base \`${base}\`.`);
                  } else if (ms !== baseVersion && ms !== baseVersion.replace(/^v/, "")) {
                    warn(`Linked-issue guard (advisory): issue #${issueNumber} milestone \`${ms}\` does not match base branch version \`${baseVersion}\`. Confirm scope belongs to this release.`);
                  } else {
                    notes.push(`Linked-issue guard: PR references #${issueNumber} (milestone \`${ms}\`).`);
                  }
                } catch (e) {
                  warn(`Linked-issue guard (advisory): could not fetch issue #${issueNumber} to verify its milestone (${e.status || e.message}).`);
                }
              }
            }

            // 3. Branch-name guard (ADVISORY). Skipped for automation branches.
            if (!isAutomationBranch) {
              const ok =
                /^(feature|fix|chore)\/\d+-.+/.test(head) ||
                /^release\/v\d+\.\d+$/.test(head) ||
                /^hotfix\/.+/.test(head) ||
                /^docs\/.+/.test(head);
              if (!ok) {
                warn(`Branch-name guard (advisory): head \`${head}\` does not match \`feature/<n>-*\`, \`fix/<n>-*\`, \`chore/<n>-*\`, \`release/vX.Y\`, \`hotfix/*\`, or \`docs/*\`.`);
              }
            }

            // Summary.
            const s = core.summary.addHeading("PR scope & naming guards", 3);
            s.addRaw(`Base: \`${base}\` - Head: \`${head}\`${isAutomationBranch ? " - automation branch" : ""}`, true);
            if (problems.length) {
              s.addHeading("Blocking failures", 4).addList(problems);
            }
            if (notes.length) {
              s.addHeading("Notes / advisories", 4).addList(notes);
            }
            if (!problems.length && !notes.length) {
              s.addRaw("All guards passed.", true);
            }
            await s.write();

            if (blocked) {
              core.setFailed("One or more BLOCKING PR guards failed — see annotations and the job summary above.");
            }

  # Fast, offline-capable gates. Runs on EVERY PR (into main or release/**) and
  # on push to main. No crypto/contract toolchain, no build, no E2E — so PR
  # feedback stays fast. All steps below are verified to pass without the
  # vendored Argent/Privacy artifacts. (`check:config` is not a separate npm
  # script — `check:files` already runs both file- and config-standards. The
  # aggregate `bun run check` is intentionally NOT used here because it chains
  # check:argent/check:privacy, which require the vendored artifacts.)
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      # These three steps use the name+run form on purpose: bun install,
      # check:files, and check:coverage also appear in release-validation, and
      # the ci-order gate in scripts/check-config-standards.ts matches bare
      # "- run: <cmd>" lines by first occurrence. Writing them as name+run keeps
      # their lines out of that match so release-validation stays the single
      # source of the ordered heavy pipeline the gate expects.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run check:lint
      - run: bun run check:types
      # check:files runs both file- and config-standards.
      - name: Standards (file + config)
        run: bun run check:files
      - run: bun run check:extension
      - run: bun run check:imports
      - run: bun run check:cycles
      - run: bun run check:deadcode
      # The leading `./` prevents Bun from matching tests inside ignored vendor checkouts.
      - run: bun test ./tests
      - run: bun run check:workspaces
      # Enforce the global unit-test coverage floor (scripts/check-coverage.ts).
      - name: Coverage floor
        run: bun run check:coverage

  # FULL release-validation suite — the complete heavy pipeline. Gated to run
  # ONLY on same-repository release/** and hotfix/** PRs into `main` (a release
  # promotion or a hotfix), i.e. the final validation before code reaches the
  # stable branch. A fork-controlled branch name never authorizes untrusted code
  # to execute on the self-hosted release runner.
  # Everyday feature/fix/chore PRs (and PRs into release/**) do NOT trigger it.
  release-validation:
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on:
      - codebuild-gha-runner-mc-wallet-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Fail the build on known high/critical advisories in the dependency tree.
      # Requires network access to the advisory database; runs right after install
      # so a vulnerable dependency blocks the rest of the pipeline. Severity gate
      # (--audit-level=high) can be tuned in package.json's check:audit script.
      - run: bun run check:audit
      # Terminal shares the root lockfile but remains a standalone dapp; verify
      # its production bundle before the extension release pipeline.
      - run: bun run --filter @mc-wallet/terminal build
      - run: bun run test:e2e:install
      - run: bun run check:files
      - run: bun run vendor:argent
      - run: bun run vendor:privacy
      - run: bun run check
      # Enforce the global unit-test coverage floor (scripts/check-coverage.ts).
      # Kept out of the aggregate `check` so the offline gate stays fast; a
      # coverage regression below the floor fails the build here.
      - run: bun run check:coverage
      - run: bun run build
      - run: bun run test:e2e
      - run: bun run package:extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mc-wallet-extension
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: mc-wallet-e2e-debug
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
