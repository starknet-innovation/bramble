name: CI

# Layered CI for trunk-based development (DEVELOPMENT.md). `main` is the only
# long-lived branch: every change is a short-lived branch with a PR into
# `main`, and releases are tags cut from `main` (release.yml).
#
# Triggers on every PR into `main` and on push to `main`. Three jobs:
#
#   - pr-guards          ADVISORY branch-name and linked-issue checks. It never
#                        fails on naming; it exists so the required check
#                        reports. Fast, hosted runner.
#   - fast-checks        the FAST, offline-capable gates: biome lint,
#                        typecheck, file/config + manifest standards,
#                        import-layer/cycle checks, unit + conformance tests, and
#                        the coverage floor. Hosted runner; no crypto/contract
#                        toolchain, no build, no E2E.
#   - release-validation the FULL heavy pipeline (verify contracts/SDKs, build,
#                        package, E2E, dependency audit, Firefox validation) on
#                        every same-repository PR into `main` and on every push
#                        to `main`. Fork PRs skip it (the self-hosted runner
#                        never executes fork code); their merge commit is
#                        validated by the push run on `main`.
#
# The scheduled tier (full suite + live Sepolia + audit against the current
# `main` commit) lives in nightly.yml.
on:
  pull_request:
    # `edited` is deliberately absent. A title or body edit re-runs on the same
    # commit, and a required job skipped there replaces an earlier failure with
    # a skip that GitHub counts as passing. Every PR targets `main`, so a PR
    # retargeted onto it shows its required checks as missing, which blocks the
    # merge until the next push.
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels its superseded run, so the self-hosted pipeline
# does not queue stale work. Pushes to `main` group by commit and are never
# cancelled: each one is the post-merge validation of what actually landed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Advisory naming and linked-issue checks (DEVELOPMENT.md). Annotations and a
  # job summary only: this job never fails a PR over its branch name or a
  # missing issue reference. It is still a required status check, so keep the
  # job name. Hosted runner; never touches the toolchain.
  pr-guards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const base = pr.base.ref;
            const head = pr.head.ref;
            // Untrusted fields are read from the event payload in JS (never
            // interpolated into a shell), so there is no injection surface.
            const text = `${pr.title || ""}\n${pr.body || ""}`;

            // Automation branches skip the naming advisory. A branch name is
            // contributor-controlled, so this only silences a warning; it
            // grants nothing.
            const AUTOMATION_PREFIXES = ["cursor/", "codex/", "claude/", "ai-findings-autofix/", "qa/", "dependabot/"];
            const isAutomationBranch = AUTOMATION_PREFIXES.some((p) => head.startsWith(p));

            const notes = [];
            const warn = (m) => { notes.push(m); core.warning(m); };

            // 1. Branch-name advisory. Recommended: <type>/<issue>-<desc>.
            if (!isAutomationBranch && !/^(feat|feature|fix|chore|docs)\/.+/.test(head)) {
              warn(`Branch-name (advisory): head \`${head}\` does not match the recommended \`feat|fix|chore|docs/<issue>-<desc>\` (see DEVELOPMENT.md).`);
            }

            // 2. Linked-issue advisory. A PR should reference the issue it
            //    serves (`#N` or `Closes/Fixes/Resolves #N`).
            if (!/#\d+\b/.test(text)) {
              warn("Linked-issue (advisory): no `#N` issue reference in the title or body. Link the issue this PR serves (`Closes #N`).");
            }

            const s = core.summary.addHeading("PR advisories", 3);
            s.addRaw(`Base: \`${base}\` - Head: \`${head}\`${isAutomationBranch ? " - automation branch" : ""}`, true);
            if (notes.length) {
              s.addList(notes);
            } else {
              s.addRaw("No advisories.", true);
            }
            await s.write();

  # Fast, offline-capable gates. Runs on EVERY PR into main and on push to
  # main. No crypto/contract toolchain, no build, no E2E — so PR
  # feedback stays fast. All steps below are verified to pass without the
  # vendored Argent/Privacy artifacts. (`check:config` is not a separate npm
  # script — `check:files` already runs both file- and config-standards. The
  # aggregate `bun run check` is intentionally NOT used here because it chains
  # check:argent/check:privacy, which require the vendored artifacts.)
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # These three steps use the name+run form on purpose: bun install,
      # check:files, and check:coverage also appear in release-validation, and
      # the ci-order gate in scripts/check-config-standards.ts matches bare
      # "- run: <cmd>" lines by first occurrence. Writing them as name+run keeps
      # their lines out of that match so release-validation stays the single
      # source of the ordered heavy pipeline the gate expects.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run check:lint
      - run: bun run check:types
      # check:files runs both file- and config-standards.
      - name: Standards (file + config)
        run: bun run check:files
      - run: bun run check:extension
      - run: bun run check:imports
      - run: bun run check:cycles
      - run: bun run check:deadcode
      # The leading `./` prevents Bun from matching tests inside ignored vendor checkouts.
      - run: bun test ./tests
      - run: bun run check:workspaces
      # Enforce the global unit-test coverage floor (scripts/check-coverage.ts).
      - name: Coverage floor
        run: bun run check:coverage

  # FULL release-validation suite — the complete heavy pipeline, on every
  # same-repository PR into `main` and on every push to `main` (the post-merge
  # validation of exactly what landed, including fork PRs' merge commits).
  # A PR head from a fork never reaches the self-hosted runner: the fork guard
  # below admits only PRs whose head lives in this repository. A push to
  # `main` is trusted (it is the merged result of a PR that passed CI).
  release-validation:
    if: >-
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on:
      - codebuild-gha-runner-mc-wallet-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # No later step talks to GitHub, so the token is not left in .git/config
      # while dependency and vendoring code runs (supply audit F3).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Fail the build on known high/critical advisories in the dependency tree.
      # Requires network access to the advisory database; runs right after install
      # so a vulnerable dependency blocks the rest of the pipeline. Severity gate
      # (--audit-level=high) can be tuned in package.json's check:audit script.
      - run: bun run check:audit
      # Terminal shares the root lockfile but remains a standalone dapp; verify
      # its production bundle before the extension release pipeline.
      - run: bun run --filter @bramble/terminal build
      - run: bun run test:e2e:install
      - run: bun run check:files
      - run: bun run vendor:argent
      - run: bun run vendor:privacy
      - run: bun run check
      # Enforce the global unit-test coverage floor (scripts/check-coverage.ts).
      # Kept out of the aggregate `check` so the offline gate stays fast; a
      # coverage regression below the floor fails the build here.
      - run: bun run check:coverage
      - run: bun run build
      - run: bun run test:e2e
      - run: bun run package:extension
      - run: bun run package:extension:firefox
      # Mozilla's own validator, the one addons.mozilla.org runs at submission.
      # Fails on AMO errors; the manifest's warning-class regressions are held
      # by tests/scripts/firefox-manifest.test.ts, which runs in `check` above.
      - run: bun run check:firefox
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bramble-extension
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: bramble-e2e-debug
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
