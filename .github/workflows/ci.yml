name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on:
      - codebuild-gha-runner-mc-wallet-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      # Cache the wasm-pack binary and the cargo download/registry so each run
      # skips recompiling wasm-pack from source and re-fetching crates. Keyed on
      # the pinned krusty revision (vendor-krusty.ts) plus the wasm-pack version;
      # this only touches ~/.cargo, never the vendor/krusty-kms clone dir.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-${{ runner.os }}-wasmpack0.13.1-${{ hashFiles('scripts/vendor-krusty.ts') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          scarb-version: 2.18.0
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: bun install --frozen-lockfile
      # Fail the build on known high/critical advisories in the dependency tree.
      # Requires network access to the advisory database; runs right after install
      # so a vulnerable dependency blocks the rest of the pipeline. Severity gate
      # (--audit-level=high) can be tuned in package.json's check:audit script.
      - run: bun run check:audit
      # apps/terminal is a standalone Vite+React app with its own package.json,
      # lockfile, and tsconfig. It is intentionally excluded from the extension's
      # root standards gates (biome, check:files, tsc), so validate it with its
      # own typecheck + production build here.
      - run: cd apps/terminal && bun install --frozen-lockfile && bun run build
      - run: bun run test:e2e:install
      - run: bun run check:files
      - run: bun run vendor:krusty
      - run: bun run vendor:multisig
      - run: bun run check
      # Enforce the global unit-test coverage floor (scripts/check-coverage.ts).
      # Kept out of the aggregate `check` so the offline gate stays fast; a
      # coverage regression below the floor fails the build here.
      - run: bun run check:coverage
      - run: bun run build
      - run: bun run test:e2e
      - run: bun run package:extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mc-wallet-extension
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: mc-wallet-e2e-debug
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
