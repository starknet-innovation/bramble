name: Nightly

# Full-suite nightly run against the ACTIVE release branch (DEVELOPMENT.md).
# This is the heaviest tier of the layered CI model: full E2E (Playwright),
# dependency audit, the extension build, and a placeholder for perf/regression
# checks (none exist in-repo yet — the step is an explicit NO-OP, never a fake
# pass). It writes a categorized summary and, on failure, upserts ONE tracking
# issue for the release.
#
# Active-branch resolution order:
#   1. repo variable `vars.ACTIVE_RELEASE_BRANCH` if set;
#   2. otherwise the highest-semver `release/vX.Y[.Z]` branch;
#   3. if neither exists, exit cleanly with a note (nothing to run).
on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Override the release branch to run against (e.g. release/v0.4). Blank = auto-resolve."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Resolve which release branch to test. Runs on a hosted runner; read-only.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.pick.outputs.branch }}
      revision: ${{ steps.pick.outputs.revision }}
    steps:
      - name: Resolve active release branch
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_RELEASE_BRANCH: ${{ vars.ACTIVE_RELEASE_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TRIGGER_REF" != "refs/heads/main" ]; then
            echo "::error::Nightly manual runs must use the workflow from main."
            exit 1
          fi
          available="$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')"
          candidate=""
          if [ -n "${INPUT_BRANCH:-}" ]; then
            echo "Using workflow_dispatch input: $INPUT_BRANCH"
            candidate="$INPUT_BRANCH"
          elif [ -n "${ACTIVE_RELEASE_BRANCH:-}" ]; then
            echo "Using vars.ACTIVE_RELEASE_BRANCH: $ACTIVE_RELEASE_BRANCH"
            candidate="$ACTIVE_RELEASE_BRANCH"
          else
            echo "Auto-resolving the highest-semver release/* branch ..."
            branches="$(printf '%s\n' "$available" | grep -E '^release/v[0-9]+\.[0-9]+(\.[0-9]+)?$' || true)"
            if [ -z "$branches" ]; then
              echo "No release/* branch found and vars.ACTIVE_RELEASE_BRANCH is unset — nothing to run."
              {
                echo "### Nightly: no active release branch"
                echo ""
                echo "No \`release/*\` branch exists and \`vars.ACTIVE_RELEASE_BRANCH\` is not set."
                echo "Exiting cleanly — nothing to test."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "branch=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            best="$(printf '%s\n' "$branches" | sed 's#^release/v##' | sort -V | tail -1)"
            candidate="release/v$best"
          fi

          # A workflow input or repo variable is untrusted configuration. Permit
          # only the canonical release namespace and require an exact branch in
          # this repository before any self-hosted runner checks it out.
          if [[ ! "$candidate" =~ ^release/v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Nightly branch must match release/vX.Y or release/vX.Y.Z exactly."
            exit 1
          fi
          if ! grep -Fxq -- "$candidate" <<< "$available"; then
            echo "::error::Nightly branch '$candidate' does not exist in $GITHUB_REPOSITORY."
            exit 1
          fi
          encoded_candidate="${candidate//\//%2F}"
          revision="$(gh api "repos/$GITHUB_REPOSITORY/commits/$encoded_candidate" --jq '.sha')"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Nightly branch did not resolve to an immutable commit."
            exit 1
          fi
          echo "Resolved: $candidate at $revision"
          echo "branch=$candidate" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  nightly:
    needs: resolve
    if: needs.resolve.outputs.branch != ''
    permissions:
      contents: read
    outputs:
      vendor: ${{ steps.vendor.outcome }}
      build: ${{ steps.build.outcome }}
      audit: ${{ steps.audit.outcome }}
      properties: ${{ steps.properties.outcome }}
      e2e_install: ${{ steps.e2e_install.outcome }}
      e2e: ${{ steps.e2e.outcome }}
    runs-on:
      - codebuild-gha-runner-mc-wallet-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # The token is not left in .git/config while dependency and vendoring code
      # runs (supply audit F3). The one fetch below that needs it gets it through
      # its own environment for that command only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out resolved release commit
        env:
          REVISION: ${{ needs.resolve.outputs.revision }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Nightly revision must be a full lowercase SHA-1."
            exit 1
          fi
          basic="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
            git fetch --no-tags --depth=1 origin "$REVISION"
          if [ "$(git rev-parse FETCH_HEAD)" != "$REVISION" ]; then
            echo "::error::Fetched nightly revision does not match the resolved commit."
            exit 1
          fi
          git checkout --detach "$REVISION"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile

      # --- Gates. Each runs to completion (continue-on-error) so the summary
      # --- can categorize every result; the job is failed explicitly at the end.
      - name: Verify privacy and contract toolchain
        id: vendor
        continue-on-error: true
        run: bun run vendor:argent && bun run vendor:privacy
      - name: Build extension
        id: build
        continue-on-error: true
        run: bun run build
      - name: Dependency audit (bun audit)
        id: audit
        continue-on-error: true
        run: bun run check:audit
      - name: Install E2E browser
        id: e2e_install
        continue-on-error: true
        run: bun run test:e2e:install
      - name: Full E2E (Playwright)
        id: e2e
        continue-on-error: true
        run: bun run test:e2e
      - name: Deterministic security property suite
        id: properties
        continue-on-error: true
        run: bun test tests/property

      - name: Categorized summary
        if: always()
        env:
          BRANCH: ${{ needs.resolve.outputs.branch }}
          VENDOR: ${{ steps.vendor.outcome }}
          BUILD: ${{ steps.build.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          PROPERTIES: ${{ steps.properties.outcome }}
          E2E_INSTALL: ${{ steps.e2e_install.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          set -euo pipefail
          declare -A GATES=(
            ["Verify upstreams (Argent+Privacy)"]="$VENDOR"
            ["Extension build"]="$BUILD"
            ["Dependency audit (bun audit)"]="$AUDIT"
            ["Security property suite"]="$PROPERTIES"
            ["E2E browser install"]="$E2E_INSTALL"
            ["Full E2E (Playwright)"]="$E2E"
          )
          failing=()
          passing=()
          for name in "${!GATES[@]}"; do
            if [ "${GATES[$name]}" = "success" ]; then passing+=("$name"); else failing+=("$name (${GATES[$name]})"); fi
          done
          {
            echo "## Nightly — \`$BRANCH\`"
            echo ""
            echo "### Newly failing / failing this run"
            if [ "${#failing[@]}" -eq 0 ]; then
              echo "_None — all executed gates passed._"
            else
              for f in "${failing[@]}"; do echo "- ${f}"; done
            fi
            echo ""
            echo "### Passing"
            if [ "${#passing[@]}" -eq 0 ]; then echo "_None._"; else for p in "${passing[@]}"; do echo "- ${p}"; done; fi
            echo ""
            echo "### Known failures"
            echo "_Not auto-classified. A failure is only 'known' once triaged against"
            echo "the nightly tracking issue below; treat everything under 'Newly"
            echo "failing' as new until then._"
            echo ""
            echo "### Flaky"
            echo "_Cannot be determined from a single run — flakiness needs run history"
            echo "(re-run comparison). Not classified here._"
            echo ""
            echo "### Regressions"
            echo "_Cannot be determined from a single run — a regression needs a known-good"
            echo "baseline from prior runs. Not classified here._"
            echo ""
            echo "### Release-blocking"
            echo "Any failing gate above blocks promoting \`$BRANCH\` to \`main\`. Vendor,"
            echo "build, and E2E failures are release-blocking; a dependency-audit"
            echo "failure is release-blocking per CONTRIBUTING.md (high/critical advisory)."
            echo ""
            echo "### Recommended next work"
            if [ "${#failing[@]}" -eq 0 ]; then
              echo "- Proceed with the release-completion checklist in RELEASING.md."
            else
              echo "- Triage the failing gates above against the nightly tracking issue."
              echo "- Do not promote this release branch to main until they are green."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if any gate failed
        if: always()
        env:
          VENDOR: ${{ steps.vendor.outcome }}
          BUILD: ${{ steps.build.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          PROPERTIES: ${{ steps.properties.outcome }}
          E2E_INSTALL: ${{ steps.e2e_install.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          set -euo pipefail
          for o in "$VENDOR" "$BUILD" "$AUDIT" "$PROPERTIES" "$E2E_INSTALL" "$E2E"; do
            if [ "$o" != "success" ]; then
              echo "At least one nightly gate did not pass — failing the job."
              exit 1
            fi
          done
          echo "All nightly gates passed."

  # Source and dependencies execute only in the read-only self-hosted job above.
  # This hosted job receives issue write permission and runs trusted workflow
  # script only; it never checks out or evaluates the selected release branch.
  report:
    needs: [resolve, nightly]
    if: always() && needs.resolve.outputs.branch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Upsert nightly tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH: ${{ needs.resolve.outputs.branch }}
          VENDOR: ${{ needs.nightly.outputs.vendor }}
          BUILD: ${{ needs.nightly.outputs.build }}
          AUDIT: ${{ needs.nightly.outputs.audit }}
          PROPERTIES: ${{ needs.nightly.outputs.properties }}
          E2E_INSTALL: ${{ needs.nightly.outputs.e2e_install }}
          E2E: ${{ needs.nightly.outputs.e2e }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH;
            const gates = [
              ["Verify upstreams (Argent+Privacy)", process.env.VENDOR],
              ["Extension build", process.env.BUILD],
              ["Dependency audit (bun audit)", process.env.AUDIT],
              ["Security property suite", process.env.PROPERTIES],
              ["E2E browser install", process.env.E2E_INSTALL],
              ["Full E2E (Playwright)", process.env.E2E],
            ];
            const failing = gates.filter(([, outcome]) => outcome !== "success");
            const title = `Nightly: ${branch} — failing checks`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            if (failing.length === 0) {
              core.info("Nightly all green — no tracking issue created.");
              return;
            }

            // Best-effort: assign the milestone matching the branch version.
            let milestoneNumber;
            const version = branch.replace(/^release\//, ""); // e.g. "v0.4"
            try {
              const milestones = await github.paginate(github.rest.issues.listMilestones, {
                owner, repo, state: "all", per_page: 100,
              });
              const milestone = milestones.find(
                (item) => item.title === version || item.title === version.replace(/^v/, ""),
              );
              if (milestone) milestoneNumber = milestone.number;
            } catch (error) {
              core.warning(`Could not list milestones: ${error.status || error.message}`);
            }

            const body = [
              `Automated nightly run for \`${branch}\` reported failing checks.`,
              "",
              `**Run:** ${runUrl}`,
              `**Last updated:** ${new Date().toISOString()}`,
              "",
              "### Failing gates",
              ...failing.map(([name, outcome]) => `- ${name} (${outcome})`),
              "",
              "See the run's job summary for the full categorized report",
              "(newly failing / known / flaky / regressions / release-blocking).",
              "",
              "This issue is upserted by `.github/workflows/nightly.yml`; it is",
              "updated in place each night and should be closed once the branch is green.",
            ].join("\n");

            const existingList = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ci-cd", per_page: 100,
            });
            const existing = existingList.find((item) => item.title === title && !item.pull_request);

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info(`Updated tracking issue #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body,
                labels: ["ci-cd", "release"],
                ...(milestoneNumber ? { milestone: milestoneNumber } : {}),
              });
              core.info(`Created tracking issue #${created.data.number}.`);
            }
