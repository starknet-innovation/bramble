name: Nightly

# Full-suite nightly run against the current `main` commit (DEVELOPMENT.md).
# This is the heaviest tier of the layered CI model: full E2E (Playwright),
# the live Sepolia import-path run (issue 821), live Sepolia sends and first
# deploys (issue 976), dependency audit and the extension build. The report job
# sorts failures into new, still failing and fixed against the open tracking
# issue, upserts that ONE issue for `main`, and closes it once green.
#
# `main` is resolved to an immutable commit once, on a hosted runner, and the
# self-hosted job detaches onto exactly that commit.
on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Resolve `main` to the commit to test. Runs on a hosted runner; read-only.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.pick.outputs.revision }}
    steps:
      - name: Resolve main commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TRIGGER_REF" != "refs/heads/main" ]; then
            echo "::error::Nightly manual runs must use the workflow from main."
            exit 1
          fi
          revision="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::main did not resolve to an immutable commit."
            exit 1
          fi
          echo "Resolved: main at $revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  nightly:
    needs: resolve
    concurrency: { group: sepolia-tx, cancel-in-progress: false } # no overlap racing for S-TXN nonces
    permissions:
      contents: read
    outputs:
      vendor: ${{ steps.vendor.outcome }}
      build: ${{ steps.build.outcome }}
      audit: ${{ steps.audit.outcome }}
      properties: ${{ steps.properties.outcome }}
      e2e_install: ${{ steps.e2e_install.outcome }}
      e2e: ${{ steps.e2e.outcome }}
      e2e_failed: ${{ steps.e2e_results.outputs.failed }}
      e2e_flaky: ${{ steps.e2e_results.outputs.flaky }}
      sepolia: ${{ steps.sepolia.outcome }}
      sepolia_configured: ${{ steps.sepolia_seeds.outputs.configured }}
      sepolia_txn: ${{ steps.sepolia_txn.outcome }}
      sepolia_txn_configured: ${{ steps.sepolia_txn_seed.outputs.configured }}
    runs-on:
      - codebuild-gha-runner-mc-wallet-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # The token is not left in .git/config while dependency and vendoring code
      # runs (supply audit F3). The one fetch below that needs it gets it through
      # its own environment for that command only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out resolved main commit
        env:
          REVISION: ${{ needs.resolve.outputs.revision }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Nightly revision must be a full lowercase SHA-1."
            exit 1
          fi
          basic="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
            git fetch --no-tags --depth=1 origin "$REVISION"
          if [ "$(git rev-parse FETCH_HEAD)" != "$REVISION" ]; then
            echo "::error::Fetched nightly revision does not match the resolved commit."
            exit 1
          fi
          git checkout --detach "$REVISION"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile

      # --- Gates. Each runs to completion (continue-on-error) so the summary
      # --- can categorize every result; the job is failed explicitly at the end.
      - name: Verify privacy and contract toolchain
        id: vendor
        continue-on-error: true
        run: bun run vendor:argent && bun run vendor:privacy
      - name: Build extension
        id: build
        continue-on-error: true
        run: bun run build
      - name: Dependency audit (bun audit)
        id: audit
        continue-on-error: true
        run: bun run check:audit
      - name: Install E2E browser
        id: e2e_install
        continue-on-error: true
        run: bun run test:e2e:install
      - name: Full E2E (Playwright)
        id: e2e
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e.json
        run: bun run test:e2e --reporter=github,list,json
      # Test titles for the report: failed after every retry, or flaky (passed
      # on a retry). Capped; the report job treats them as untrusted text.
      - name: E2E test results
        id: e2e_results
        if: always()
        continue-on-error: true
        run: |
          bun -e '
            const fs = require("node:fs");
            const file = `${process.env.RUNNER_TEMP}/e2e.json`;
            const failed = [];
            const flaky = [];
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests ?? []) {
                  const name = `${spec.file}: ${spec.title}`;
                  if (test.status === "unexpected") failed.push(name);
                  if (test.status === "flaky") flaky.push(name);
                }
              }
              for (const child of suite.suites ?? []) walk(child);
            };
            if (fs.existsSync(file)) walk(JSON.parse(fs.readFileSync(file, "utf8")));
            const out = (key, list) =>
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${JSON.stringify(list.slice(0, 20))}\n`);
            out("failed", failed);
            out("flaky", flaky);
          '
      # Runs before either Sepolia step, so nothing they write can be in it. The
      # E2E suite has no network and uses only the published test phrase.
      - name: Upload E2E debug files
        if: steps.e2e.outcome == 'failure'
        continue-on-error: true # a failed upload must not skip the gates below
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-e2e-debug
          path: test-results/
          retention-days: 7
          overwrite: true # a re-run attempt reuses the name
          if-no-files-found: ignore
      - name: Deterministic security property suite
        id: properties
        continue-on-error: true
        run: bun test tests/property
      # Live Sepolia run of every in-wallet import path against the issue-821
      # test accounts (tools/vendor-dataset/verify-sepolia.ts). It sends nothing:
      # a broadcast firewall aborts every send. Its testnet-only seed file is a
      # secret only this step sees: written owner-only to the
      # runner's temp directory and removed when the step ends. The run's own
      # redactor keeps seeds and derived keys out of every line it prints. It
      # records no tape and uploads nothing: this is a public repository, and
      # a run's network traffic is not for publishing (replay is local-only).
      # Until the secret is configured the gate is skipped: the summary lists it
      # under "Not run" and says not to release, and it is never shown as passed.
      # Any other skip (an earlier hard failure) counts as failing. Only a
      # boolean leaves this step; the secret itself reaches the live step alone.
      - name: Sepolia seeds configured
        id: sepolia_seeds
        env:
          CONFIGURED: ${{ secrets.BRAMBLE_SEPOLIA_SEEDS != '' }}
        run: echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
      - name: Sepolia import paths (live)
        id: sepolia
        if: steps.sepolia_seeds.outputs.configured == 'true'
        continue-on-error: true
        env:
          BRAMBLE_SEPOLIA_SEEDS: ${{ secrets.BRAMBLE_SEPOLIA_SEEDS }}
        run: |
          set -euo pipefail
          if [ -z "${BRAMBLE_SEPOLIA_SEEDS:-}" ]; then
            echo "::error::The BRAMBLE_SEPOLIA_SEEDS secret is not set (tools/vendor-dataset/README.md)."
            exit 1
          fi
          if [ ! -f tools/vendor-dataset/verify-sepolia.ts ]; then
            echo "::error::This commit predates the Sepolia runner (issue 821)."
            exit 1
          fi
          umask 077
          seeds="$RUNNER_TEMP/sepolia-seeds.env"
          trap 'rm -f "$seeds"' EXIT
          printf '%s\n' "$BRAMBLE_SEPOLIA_SEEDS" > "$seeds"
          unset BRAMBLE_SEPOLIA_SEEDS
          # GitHub masks a multi-line secret line by line, and a line here is
          # NAME="value", so each value is masked on its own as well.
          while IFS= read -r line; do
            value="${line#*=}"
            value="${value%$'\r'}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            value="${value#\"}"
            value="${value%\"}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done < "$seeds"
          # The newest committed scorecard, if this commit has one (dated names sort in order).
          set -- "$RUNNER_TEMP/sepolia/scorecard.json"
          for previous in tools/vendor-dataset/verification-sepolia-*.json; do
            if [ -f "$previous" ]; then set -- "$RUNNER_TEMP/sepolia/scorecard.json" "$previous"; fi
          done
          mkdir -p "$RUNNER_TEMP/sepolia"
          BRAMBLE_DATASET_ENV_FILE="$seeds" BRAMBLE_E2E_LIVE_NETWORK=1 BRAMBLE_DATASET_NETWORK=sepolia \
            bun tools/vendor-dataset/verify-sepolia.ts "$@"
      # Live Sepolia sends and first deploys (issue 976), testnet STRK only,
      # behind a broadcast firewall. Same handling as the import gate: the
      # S-TXN phrase reaches this step alone, and the run uploads nothing. A
      # short bank fails as "Sepolia bank low" before anything is sent.
      - name: Sepolia send seed configured
        id: sepolia_txn_seed
        env:
          CONFIGURED: ${{ secrets.BRAMBLE_SEPOLIA_TXN_SEED != '' }}
        run: echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
      - name: Sepolia sends and deploys (live)
        id: sepolia_txn
        if: steps.sepolia_txn_seed.outputs.configured == 'true'
        continue-on-error: true
        env:
          BRAMBLE_SEPOLIA_TXN_SEED: ${{ secrets.BRAMBLE_SEPOLIA_TXN_SEED }}
        run: |
          set -euo pipefail
          if [ ! -f tools/vendor-dataset/sepolia-bank-runway.ts ]; then
            echo "::error::This commit predates the Sepolia send run (issue 976)."
            exit 1
          fi
          umask 077
          seeds="$RUNNER_TEMP/sepolia-txn-seed.env"
          trap 'rm -f "$seeds"' EXIT
          echo "::add-mask::$BRAMBLE_SEPOLIA_TXN_SEED"
          printf 'BRAMBLE_DATASET_SEED_S_TXN="%s"\n' "${BRAMBLE_SEPOLIA_TXN_SEED//[$'\r\n']/}" > "$seeds"
          unset BRAMBLE_SEPOLIA_TXN_SEED
          export BRAMBLE_DATASET_ENV_FILE="$seeds" BRAMBLE_E2E_LIVE_NETWORK=1 BRAMBLE_DATASET_NETWORK=sepolia
          bun tools/vendor-dataset/sepolia-bank-runway.ts
          status=0
          bun tools/vendor-dataset/verify-sepolia-sends.ts || status=1
          bun tools/vendor-dataset/verify-sepolia-deploys.ts || status=1
          exit "$status"

      - name: Fail the job if any gate failed
        if: always()
        env:
          VENDOR: ${{ steps.vendor.outcome }}
          BUILD: ${{ steps.build.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          PROPERTIES: ${{ steps.properties.outcome }}
          E2E_INSTALL: ${{ steps.e2e_install.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          SEPOLIA: ${{ steps.sepolia.outcome }}
          SEPOLIA_CONFIGURED: ${{ steps.sepolia_seeds.outputs.configured }}
          SEPOLIA_TXN: ${{ steps.sepolia_txn.outcome }}
          SEPOLIA_TXN_CONFIGURED: ${{ steps.sepolia_txn_seed.outputs.configured }}
        run: |
          set -euo pipefail
          # Skipped because the secret is unset: not run, not failed. Any other skip fails.
          if [ "$SEPOLIA" = "skipped" ] && [ "$SEPOLIA_CONFIGURED" = "false" ]; then SEPOLIA=success; fi
          if [ "$SEPOLIA_TXN" = "skipped" ] && [ "$SEPOLIA_TXN_CONFIGURED" = "false" ]; then SEPOLIA_TXN=success; fi
          for o in "$VENDOR" "$BUILD" "$AUDIT" "$PROPERTIES" "$E2E_INSTALL" "$E2E" "$SEPOLIA" "$SEPOLIA_TXN"; do
            if [ "$o" != "success" ]; then
              echo "At least one nightly gate did not pass — failing the job."
              exit 1
            fi
          done
          echo "All nightly gates that ran passed."

  # Source and dependencies execute only in the read-only self-hosted job above.
  # This hosted job receives issue write permission and runs trusted workflow
  # script only; it never checks out or evaluates the tested commit.
  report:
    needs: [resolve, nightly]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report and track
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVISION: ${{ needs.resolve.outputs.revision }}
          VENDOR: ${{ needs.nightly.outputs.vendor }}
          BUILD: ${{ needs.nightly.outputs.build }}
          AUDIT: ${{ needs.nightly.outputs.audit }}
          PROPERTIES: ${{ needs.nightly.outputs.properties }}
          E2E_INSTALL: ${{ needs.nightly.outputs.e2e_install }}
          E2E: ${{ needs.nightly.outputs.e2e }}
          E2E_FAILED: ${{ needs.nightly.outputs.e2e_failed }}
          E2E_FLAKY: ${{ needs.nightly.outputs.e2e_flaky }}
          SEPOLIA: ${{ needs.nightly.outputs.sepolia }}
          SEPOLIA_CONFIGURED: ${{ needs.nightly.outputs.sepolia_configured }}
          SEPOLIA_TXN: ${{ needs.nightly.outputs.sepolia_txn }}
          SEPOLIA_TXN_CONFIGURED: ${{ needs.nightly.outputs.sepolia_txn_configured }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const env = process.env;
            const revision = String(env.REVISION || "").slice(0, 40);
            const gates = [
              { name: "Verify upstreams (Argent+Privacy)", outcome: env.VENDOR },
              { name: "Extension build", outcome: env.BUILD },
              { name: "Dependency audit (bun audit)", outcome: env.AUDIT },
              { name: "Security property suite", outcome: env.PROPERTIES },
              { name: "E2E browser install", outcome: env.E2E_INSTALL },
              { name: "Full E2E (Playwright)", outcome: env.E2E },
              { name: "Sepolia import paths (live)", outcome: env.SEPOLIA,
                secret: "BRAMBLE_SEPOLIA_SEEDS", configured: env.SEPOLIA_CONFIGURED },
              { name: "Sepolia sends and deploys (live)", outcome: env.SEPOLIA_TXN,
                secret: "BRAMBLE_SEPOLIA_TXN_SEED", configured: env.SEPOLIA_TXN_CONFIGURED },
            ];
            // Skipped because its secret is unset: not run, not failed. Any other skip fails.
            const notRun = gates.filter((g) => g.secret && g.outcome === "skipped" && g.configured === "false");
            const failingGates = gates.filter((g) => !notRun.includes(g) && g.outcome !== "success");

            // Test titles come from the tested code: untrusted. Keep them
            // strings, cap them, and render them only inside code spans.
            const strings = (value, max = 20) =>
              Array.isArray(value) ? value.filter((t) => typeof t === "string").slice(0, max) : [];
            const parse = (raw) => { try { return JSON.parse(raw || "[]"); } catch { return []; } };
            const code = (text) => "`" + text.replace(/[`\r\n]/g, "'").slice(0, 200) + "`";
            const failedTests = strings(parse(env.E2E_FAILED));
            const flakyTests = strings(parse(env.E2E_FLAKY));

            const failing = [
              ...failingGates.map((g) => `gate: ${g.name}`),
              ...failedTests.map((t) => `test: ${t}`),
            ];
            const show = (key) => {
              const name = key.slice(6); // after "gate: " or "test: "
              if (key.startsWith("test: ")) return `- ${code(name)}`;
              const gate = failingGates.find((g) => g.name === name);
              return gate ? `- ${name} (${gate.outcome || "no result"})` : `- ${name}`;
            };

            // The open tracking issue is the baseline: a hidden state line lists
            // what was failing last time. No open issue means nothing is known.
            const title = "Nightly: main — failing checks";
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ci-cd", per_page: 100,
            });
            const existing = open.find((item) => item.title === title && !item.pull_request);
            const stateLine = /<!-- nightly-state: (.*) -->\s*$/; // last line; titles sit above it
            const known = existing ? strings(parse(stateLine.exec(existing.body || "")?.[1]), 100) : [];
            const newly = failing.filter((key) => !known.includes(key));
            const still = failing.filter((key) => known.includes(key));
            const fixed = known.filter((key) => !failing.includes(key));

            const runUrl = `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`;
            const section = (heading, lines) => (lines.length ? ["", `### ${heading}`, ...lines] : []);
            const report = [
              `Nightly run for \`main\` at ${code(revision)}: ${runUrl}`,
              ...section("New failures", newly.map(show)),
              ...section("Still failing", still.map(show)),
              ...section("Fixed since last run", fixed.map(show)),
              ...section("Flaky (passed on retry)", flakyTests.map((t) => `- ${code(t)}`)),
              ...section("Not run", notRun.map((g) => `- ${g.name}: the ${g.secret} secret is not configured`)),
              "",
              failing.length
                ? "Do not cut a release from `main` until it is green. \"Sepolia bank low\" means refill the bank, not a wallet bug."
                : notRun.length
                  ? "Do not cut a release from `main` until every gate has run (tools/vendor-dataset/README.md)."
                  : "All gates passed. Continue with RELEASING.md.",
            ];
            await core.summary.addRaw(report.join("\n")).write();

            if (failing.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number, body: `Green in ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: "closed", state_reason: "completed",
                });
                core.info(`Closed tracking issue #${existing.number}.`);
              }
              return;
            }

            // Dashes escaped so no test title can end the HTML comment early.
            const state = JSON.stringify(failing).replace(/-/g, "\\u002d");
            const body = [
              ...report,
              "",
              "This issue is updated by `.github/workflows/nightly.yml` each night and closed when `main` is green.",
              `<!-- nightly-state: ${state} -->`,
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info(`Updated tracking issue #${existing.number}.`);
              return;
            }
            const created = await github.rest.issues.create({
              owner, repo, title, body,
              labels: ["ci-cd", "release"],
            });
            core.info(`Created tracking issue #${created.data.number}.`);
