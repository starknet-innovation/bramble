name: Ledger E2E

# Speculos Ledger E2E (issue 861) on a GitHub-hosted runner.
#
# Builds the extension and the digest-pinned Ledger Starknet app, starts the
# digest-pinned Speculos emulator on loopback, and runs the Ledger import and
# blind-sign suite (tests/e2e/ledger). The emulator is seeded with the
# repository's PUBLIC test phrase; the workflow holds no repository secret and a
# read-only token, so ordinary pull_request runs from forks are safe.
#
# Two modes, never mixed:
#   - test (every trigger): fails at once while the app binary hashes in
#     scripts/ledger-app-pins.ts are unrecorded (null), and otherwise runs the
#     suite with BRAMBLE_SPECULOS_REQUIRED=1, so a missing Docker, binary or
#     emulator is a failure, never a skipped pass.
#   - record (workflow_dispatch with record_hashes=true): builds the app for
#     every model and prints each ELF's SHA-256 to the job summary for a
#     maintainer to review and commit. It runs no test and the test job is
#     skipped, so it can never stand in for a test run.
#
# The reviewed controls live in scripts/ledger-e2e-workflow-policy.ts (the
# nightly target in scripts/ledger-e2e-nightly-target.ts) and are
# mutation-tested in tests/scripts/ledger-e2e-workflow.test.ts and
# tests/scripts/ledger-e2e-nightly-target.test.ts.
# A record run is named as one, so it is never read as a test run.
run-name: ${{ inputs.record_hashes && 'Record Ledger app hashes (no tests run)' || '' }}

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "packages/platform/ledger-*/**"
      - "packages/presentation/wallet-ui/src/sidepanel/journeys/ledger/**"
      - "packages/presentation/wallet-ui/src/sidepanel/journeys/approvals/**"
      - "packages/presentation/wallet-ui/src/popup/responses/responses-ledger.ts"
      - "packages/features/transactions/src/routing/ledger-verify.ts"
      - "packages/foundation/wallet-model/src/accounts/ledger-path.ts"
      - "packages/testing/testkit/src/ledger-management.ts"
      - "apps/extension/src/background/ledger/**"
      - "apps/extension/src/ledger-grant/**"
      - "apps/extension/public/ledger-grant.html"
      - "tests/e2e/ledger/**"
      - "tests/e2e/extension-fixture.ts"
      - "tests/e2e/global-setup.ts"
      - "tests/e2e/wallet-helpers.ts"
      - "scripts/*ledger*"
      - "playwright.ledger.config.ts"
      - ".github/workflows/ledger-e2e.yml"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main, "release/**"]
    paths:
      - "packages/platform/ledger-*/**"
      - "packages/presentation/wallet-ui/src/sidepanel/journeys/ledger/**"
      - "packages/presentation/wallet-ui/src/sidepanel/journeys/approvals/**"
      - "packages/presentation/wallet-ui/src/popup/responses/responses-ledger.ts"
      - "packages/features/transactions/src/routing/ledger-verify.ts"
      - "packages/foundation/wallet-model/src/accounts/ledger-path.ts"
      - "packages/testing/testkit/src/ledger-management.ts"
      - "apps/extension/src/background/ledger/**"
      - "apps/extension/src/ledger-grant/**"
      - "apps/extension/public/ledger-grant.html"
      - "tests/e2e/ledger/**"
      - "tests/e2e/extension-fixture.ts"
      - "tests/e2e/global-setup.ts"
      - "tests/e2e/wallet-helpers.ts"
      - "scripts/*ledger*"
      - "playwright.ledger.config.ts"
      - ".github/workflows/ledger-e2e.yml"
      - "package.json"
      - "bun.lock"
  # Offset from nightly (03:00) and the phishing feed check (06:17). A
  # scheduled run uses the workflow file on the default branch, but tests the
  # active release branch (see "Resolve the nightly release commit").
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      record_hashes:
        description: "Record mode: build the pinned Ledger app and print each ELF SHA-256. Runs no tests."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ledger-e2e-${{ github.event_name }}-${{ inputs.record_hashes && 'record' || 'test' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  speculos:
    name: Speculos Ledger E2E
    if: ${{ !inputs.record_hashes }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Nightly (schedule) only: test the active release branch, resolved as
      # nightly.yml resolves it: vars.ACTIVE_RELEASE_BRANCH, else the highest
      # release/vX.Y[.Z]; the exact pattern, an existing branch, and the
      # commit it pointed at, so the checkout below is immutable. The branch
      # list and commit come from one anonymous ls-remote of this public
      # repository, because no step here may hold the GitHub token. Other
      # events output an empty revision, so checkout keeps its default ref.
      - name: Resolve the nightly release commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTIVE_RELEASE_BRANCH: ${{ vars.ACTIVE_RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "revision=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          heads="$(git ls-remote --heads "https://github.com/$GITHUB_REPOSITORY.git" 'refs/heads/release/*')"
          if [ -n "${ACTIVE_RELEASE_BRANCH:-}" ]; then
            echo "Using vars.ACTIVE_RELEASE_BRANCH: $ACTIVE_RELEASE_BRANCH"
            candidate="$ACTIVE_RELEASE_BRANCH"
          else
            echo "Auto-resolving the highest-semver release/* branch ..."
            branches="$(printf '%s\n' "$heads" | awk '{print $2}' | sed 's#^refs/heads/##' | grep -E '^release/v[0-9]+\.[0-9]+(\.[0-9]+)?$' || true)"
            if [ -z "$branches" ]; then
              echo "::error::No release/* branch exists and vars.ACTIVE_RELEASE_BRANCH is unset."
              exit 1
            fi
            best="$(printf '%s\n' "$branches" | sed 's#^release/v##' | sort -V | tail -1)"
            candidate="release/v$best"
          fi
          if [[ ! "$candidate" =~ ^release/v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Nightly branch must match release/vX.Y or release/vX.Y.Z exactly."
            exit 1
          fi
          revision="$(printf '%s\n' "$heads" | awk -v ref="refs/heads/$candidate" '$2 == ref {print $1}')"
          if [ -z "$revision" ]; then
            echo "::error::Nightly branch '$candidate' does not exist in $GITHUB_REPOSITORY."
            exit 1
          fi
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Nightly branch did not resolve to an immutable commit."
            exit 1
          fi
          echo "Resolved: $candidate at $revision"
          echo "Nightly Ledger E2E: \`$candidate\` at \`$revision\`" >> "$GITHUB_STEP_SUMMARY"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.target.outputs.revision }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      # First, before any download or build: with unrecorded hashes the suite
      # cannot run, and this run must fail rather than report green.
      - name: Require recorded Ledger app hashes
        run: bun run scripts/ledger-app-hashes.ts require nanosp flex
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun run vendor:argent
      - run: bun run vendor:privacy
      - run: bun run build
      - name: Install Playwright Chromium
        run: bun run test:e2e:install --with-deps
      - name: Build the pinned Ledger app
        timeout-minutes: 40
        run: bun run vendor:ledger-app nanosp flex
      - name: Speculos Ledger E2E
        timeout-minutes: 30
        run: BRAMBLE_SPECULOS_REQUIRED=1 bun run test:e2e:ledger
      # Exit 0 is not proof: every test could have been skipped.
      - name: Require executed, passing Ledger tests
        run: bun run scripts/ledger-e2e-results.ts nanosp flex
      # Playwright output only: traces, screenshots and videos of the wallet
      # driven with the public test phrase. No profile, vault or build output.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ledger-e2e-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  record-hashes:
    name: Record Ledger app hashes (no tests run)
    if: github.event_name == 'workflow_dispatch' && inputs.record_hashes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the pinned Ledger app (every model)
        timeout-minutes: 60
        run: bun run vendor:ledger-app
      # bash with pipefail, so a failed report is not hidden by tee.
      - name: Report ELF hashes for review
        shell: bash
        run: bun run scripts/ledger-app-hashes.ts record | tee -a "$GITHUB_STEP_SUMMARY"
