name: Release

# Tag-driven release pipeline (issue #58). Pushing a `vX.Y.Z` tag builds and
# packages the extension via the reusable `release-build.yml` workflow, publishes
# a GitHub Release with the reproducible zip + SHA-256, and — only on an explicit
# manual dispatch with publish=true — pushes that same zip to the Chrome Web
# Store. The store publish is WIRED BUT DISABLED: it never runs on a tag push and
# skips cleanly until the four CWS_* secrets exist in the `chrome-web-store`
# environment. The manual runbook and prerequisites live in RELEASING.md.
#
# The automatic release-on-merge path (a release/hotfix branch merged into main)
# lives in auto-release.yml; it calls the SAME reusable build so the heavy
# pipeline is defined once.
on:
  push:
    tags:
      # Final-release tags only. The single-source gate (check:release-version)
      # accepts exactly `vX.Y.Z`, so admitting a prerelease tag here — e.g. an RC
      # `vX.Y.Z-rc.N`, which RELEASING.md documents as validation-only and
      # explicitly non-publishing — would run the whole reusable build (toolchain,
      # vendor, package) only to hard-fail at the gate with a misleading "version
      # mismatch". Excluding hyphenated (prerelease) tags keeps the trigger and
      # the gate in agreement and honors "RC tags do not publish".
      - "v*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built zip to the Chrome Web Store"
        type: boolean
        default: false
      publish_target:
        description: "Chrome Web Store audience"
        type: choice
        options:
          - trustedTesters
          - default
        default: trustedTesters
      deploy_percentage:
        description: "Optional staged rollout percentage (0-100); blank = full rollout"
        type: string
        default: ""
      dry_run:
        description: "Validate the package and request plan without publishing"
        type: boolean
        default: false

# Least privilege: only the build job needs to write releases (granted in the
# reusable workflow); the Chrome Web Store job authenticates with its own CWS_*
# secrets, not the GitHub token.
permissions:
  contents: read

jobs:
  # Resolve the build inputs from the trigger. A tag push releases that tag; a
  # manual dispatch resolves the current version from trusted `main` and builds
  # the existing immutable release tag for that version (create_release=false —
  # the dispatch never cuts a GitHub Release).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      commit_sha: ${{ steps.pick.outputs.commit_sha }}
      create_release: ${{ steps.pick.outputs.create_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual dispatcher may select any branch in the UI. Never execute
          # that selected ref while deriving the privileged store-publish input.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      # Untrusted-input note: REF_NAME/EVENT_NAME are passed via env (never
      # interpolated into the shell). A tag ref is constrained to `v*` by the
      # trigger; the dispatch path derives the tag from package.json instead.
      - name: Resolve build inputs
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$TRIGGER_REF" != "refs/heads/main" ]; then
              echo "::error::Manual release runs must use the workflow from main."
              exit 1
            fi
            version="$(bun --print "require('./package.json').version")"
            tag="v${version}"
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "::error::Release tag ${tag} does not exist. Manual store publishing only accepts an existing immutable release tag."
              exit 1
            fi
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          fi
          commit_sha="$(git rev-list -n1 "${tag}^{commit}" 2>/dev/null || true)"
          if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release tag ${tag} did not resolve to an immutable commit."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

  build-release:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
      create_release: ${{ needs.prepare.outputs.create_release == 'true' }}

  # OPTIONAL / GATED. Never runs on a tag push. Only a manual dispatch with
  # publish=true reaches this job, and even then the publish script skips
  # cleanly if the CWS_* secrets are absent. The `chrome-web-store` environment
  # scopes the secrets so PR/fork runs can never read them.
  publish-chrome-web-store:
    needs: [prepare, build-release]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish == true
    environment: chrome-web-store
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Execute the reviewed publish client from protected `main`; the bytes
          # being uploaded still come exclusively from the immutable tag build.
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mc-wallet-release
          path: artifacts
      - name: Verify downloaded checksum
        working-directory: artifacts
        run: sha256sum -c ./*.zip.sha256
      - name: Resolve packaged zip path
        id: zip
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(artifacts/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one packaged zip, found ${#zips[@]}."
            exit 1
          fi
          echo "path=${zips[0]}" >> "$GITHUB_OUTPUT"
      # The publish client fails closed on a real API rejection but skips
      # cleanly (exit 0) when any CWS_* secret is missing, so this job is safe
      # even before a Chrome Web Store account exists.
      - name: Publish to Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_ZIP_PATH: ${{ steps.zip.outputs.path }}
          CWS_PUBLISH_TARGET: ${{ inputs.publish_target }}
          CWS_DEPLOY_PERCENTAGE: ${{ inputs.deploy_percentage }}
          CWS_DRY_RUN: ${{ inputs.dry_run }}
        run: bun run scripts/publish-chrome-web-store.ts
