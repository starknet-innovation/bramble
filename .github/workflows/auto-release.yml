name: Auto release on merge

# Automatic release-on-merge (issue #58/#59/#60). When a `release/*` or
# `hotfix/*` branch is promoted into `main`, this cuts the release WITHOUT a
# manual tag push: it derives the version from the merged branch, creates the
# `vX.Y.Z` tag on the merge commit, and calls the reusable `release-build.yml`
# to build/package the correctly-versioned artifact, generate the changelog
# notes, and create the GitHub Release.
#
# TRIGGER + GUARD. It runs on every push to `main`, but only cuts a release when
# BOTH conditions hold, so ordinary chore/docs merges never trigger one:
#   1. the merged head branch is `release/vX.Y` or `hotfix/*` (resolved from the
#      PR associated with the merge commit, with a merge-message fallback); and
#   2. the single-source gate (scripts/release-version.ts) resolves a version and
#      the tag does not already exist (idempotent — a re-run never double-cuts).
# For a `release/vX.Y` promotion the gate ALSO asserts the branch-implied version
# (X.Y.0) equals package.json/manifest, so a promotion that forgot the version
# bump FAILS here instead of shipping a mislabeled artifact (the v0.4.0-as-0.3.0
# defect). Nothing pushes to `main`; the changelog is maintained on the release
# branch during prep and consumed as notes here.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create + push the release tag on the merge commit
      pull-requests: read # resolve the merged head branch
    outputs:
      should_release: ${{ steps.tag.outputs.should_release }}
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      # Resolve the merged head branch for this merge commit. Read entirely in JS
      # from the API / event payload — no untrusted value is interpolated into a
      # shell — so there is no injection surface.
      - name: Resolve merged head branch
        id: pr
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            let head = "";
            try {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: sha,
              });
              const merged = prs.find((p) => p.merged_at) ?? prs[0];
              if (merged) head = merged.head.ref;
            } catch (e) {
              core.warning(`Could not list PRs for ${sha}: ${e.status || e.message}`);
            }
            if (!head) {
              // Fallback: parse the standard merge-commit subject.
              const msg = context.payload.head_commit?.message ?? "";
              const m = msg.match(/^Merge pull request #\d+ from [^/\s]+\/(\S+)/);
              if (m) head = m[1];
            }
            core.info(`Resolved merged head branch: ${head || "(none)"}`);
            core.setOutput("head_ref", head);
      # List the release tags that already exist so the gate can fail a hotfix
      # promotion closed when it resolves to an already-cut tag (a forgotten
      # version bump). ls-remote is the same authoritative source the tag step
      # below uses for its idempotency check.
      - name: List existing release tags
        id: tags
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin 'refs/tags/v*' \
            | sed -E 's#.*refs/tags/##; /\^\{\}$/d' \
            | tr '\n' ' ')"
          echo "Existing release tags: ${existing:-(none)}"
          {
            echo "existing<<TAGS_EOF"
            echo "$existing"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
      # Single-source release gate. Emits release/version/tag/kind to the step
      # output; FAILS the job on any drift (e.g. release/vX.Y promoted without the
      # matching version bump, or a hotfix/* promotion whose tag already exists
      # because it forgot to bump the version).
      - name: Release-version gate
        id: gate
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          EXISTING_TAGS: ${{ steps.tags.outputs.existing }}
        run: bun run check:release-version
      # Create the tag on the merge commit unless the branch is not a promotion
      # or the tag already exists (idempotent).
      - name: Create release tag
        id: tag
        env:
          RELEASE: ${{ steps.gate.outputs.release }}
          TAG: ${{ steps.gate.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" != "true" ]; then
            echo "Not a release/hotfix promotion — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — release already cut; skipping (idempotent)."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$SHA"
          git push origin "refs/tags/${TAG}"
          echo "Created and pushed ${TAG} on ${SHA}."
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  # Build/package/notes/release via the SAME reusable workflow the tag-push path
  # uses. The tag pushed above (by GITHUB_TOKEN) does not itself trigger
  # release.yml — GitHub suppresses workflow-triggered token pushes — so calling
  # the reusable build directly is what actually cuts the release.
  release:
    needs: compute
    if: needs.compute.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.compute.outputs.tag }}
      ref: ${{ needs.compute.outputs.tag }}
      create_release: true
